<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUNWOO KIM</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--mut:#8b949e;--acc:#58a6ff;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
  .card{max-width:640px;width:100%;background:var(--card);border:1px solid var(--line);
        border-radius:16px;padding:48px 40px}
  .avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#58a6ff,#1f6feb);
          display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;margin-bottom:24px}
  h1{font-size:32px;letter-spacing:-.5px}
  .role{color:var(--acc);font-weight:600;margin-top:6px}
  p.bio{color:var(--mut);margin-top:18px}
  .tags{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px}
  .tag{background:#21262d;border:1px solid var(--line);color:var(--fg);font-size:13px;
       padding:5px 12px;border-radius:20px}
  .links{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap}
  a.btn{text-decoration:none;color:var(--fg);background:#21262d;border:1px solid var(--line);
        padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;transition:.15s}
  a.btn:hover{border-color:var(--acc);color:var(--acc)}
  footer{margin-top:36px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">JW</div>
    <h1>JUNWOO KIM</h1>
    <div class="role">Backend &middot; IT Systems Engineer</div>
    <p class="bio">물류 &middot; e-커머스 도메인의 백엔드와 IT 시스템을 다룹니다. 안정적인 데이터 파이프라인과 자동화에 관심이 많습니다.</p>
    <div class="tags">
      <span class="tag">Java</span><span class="tag">Backend</span><span class="tag">MES / WMS</span>
      <span class="tag">Database</span><span class="tag">Automation</span><span class="tag">IT Infra</span>
    </div>
    <div class="links">
      <a class="btn" href="https://github.com/junwo0" target="_blank" rel="noopener">GitHub</a>
    </div>
    <footer>&copy; 2026 JUNWOO KIM &middot; Built with GitHub Pages</footer>
  </main>
</body>
</html>
